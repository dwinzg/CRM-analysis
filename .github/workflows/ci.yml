# Runs the test suite on every push and pull request to main.
#
# The whole suite is offline. It reads saved fixtures instead of the live site
# and CRM, so it needs no token and no network access.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q
